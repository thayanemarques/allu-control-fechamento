<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>allu · Control Fechamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#27AE60; --verde-d:#1E8A4C; --verde-l:#E9F7EF;
  --dark:#2E2F39; --dark-2:#3A3B47; --off:#F4F4EF;
  --branco:#FFFFFF; --linha:#E7E7E1; --linha-2:#EFEFEA;
  --txt:#2E2F39; --txt-2:#6B6C78; --txt-3:#9A9BA6;
  --azul:#2D7FF9; --azul-l:#E8F0FE;
  --amarelo:#E2A32B; --amarelo-l:#FBF3E1;
  --vermelho:#E23D3D; --vermelho-l:#FCEAEA;
  --preto:#2E2F39; --cinza-l:#EDEDE8;
  --sombra:0 1px 2px rgba(46,47,57,.04),0 4px 16px rgba(46,47,57,.06);
  --sombra-2:0 8px 32px rgba(46,47,57,.12);
  --r:14px; --r-s:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--off); color:var(--txt);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--txt)}
.mono{font-family:'DM Mono',monospace}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D6D6CF;border-radius:8px;border:2px solid var(--off)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- LAYOUT ---------- */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh;overflow:hidden}

/* ---------- SIDEBAR ---------- */
.side{background:var(--dark);color:#fff;display:flex;flex-direction:column;overflow:hidden}
.brand{padding:22px 22px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--verde);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.brand .bt{font-weight:700;font-size:15px;letter-spacing:.2px;line-height:1.1}
.brand .bs{font-size:10.5px;color:rgba(255,255,255,.5);letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:14px 12px 24px}
.nav .grp{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:rgba(255,255,255,.34);padding:16px 12px 7px;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:rgba(255,255,255,.72);font-weight:500;font-size:13.5px;margin-bottom:1px;transition:.13s;position:relative}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--verde);color:#fff;box-shadow:0 3px 10px rgba(39,174,96,.35)}
.nav a .ic{width:18px;text-align:center;flex:none;opacity:.9}
.nav a .badge{margin-left:auto;background:var(--vermelho);color:#fff;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.nav a.on .badge{background:rgba(255,255,255,.25)}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:rgba(255,255,255,.4)}

/* ---------- TOPBAR ---------- */
.main{display:flex;flex-direction:column;overflow:hidden}
.top{height:60px;background:var(--branco);border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:14px;padding:0 24px;flex:none;z-index:20}
.top .title{font-weight:700;font-size:16px;flex:none}
.top .title small{display:block;font-weight:500;font-size:11px;color:var(--txt-3);letter-spacing:.3px}
.search{margin-left:12px;flex:1;max-width:340px;position:relative}
.search input{width:100%;background:var(--off);border:1px solid var(--linha);border-radius:10px;padding:9px 12px 9px 34px;outline:none;transition:.15s}
.search input:focus{border-color:var(--verde);background:#fff}
.search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--txt-3)}
.top .sp{flex:1}
.selctrl{display:flex;align-items:center;gap:7px;background:var(--off);border:1px solid var(--linha);border-radius:10px;padding:7px 11px;font-weight:600;font-size:13px}
.selctrl select{border:none;background:none;outline:none;font-weight:600;cursor:pointer}
.selctrl .lbl{font-size:10px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.iconbtn{width:38px;height:38px;border-radius:10px;background:var(--off);border:1px solid var(--linha);display:grid;place-items:center;position:relative;transition:.13s}
.iconbtn:hover{background:#fff;border-color:var(--verde)}
.iconbtn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--vermelho);border:2px solid #fff}
.perfil{display:flex;align-items:center;gap:9px;padding:5px 6px 5px 12px;border:1px solid var(--linha);border-radius:24px;background:var(--off)}
.perfil select{border:none;background:none;outline:none;font-weight:600;font-size:13px;cursor:pointer}
#userSelect{max-width:160px}
.perfil .av{width:30px;height:30px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px}

.content{flex:1;overflow-y:auto;padding:24px}
.view{max-width:1280px;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- COMMON ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.page-head p{color:var(--txt-2);font-size:13px;margin-top:3px}
.card{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra)}
.card-pad{padding:20px}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--txt-2);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--verde);color:#fff;font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:10px;transition:.13s;box-shadow:0 2px 8px rgba(39,174,96,.28)}
.btn:hover{background:var(--verde-d)}
.btn.ghost{background:var(--off);color:var(--txt);box-shadow:none;border:1px solid var(--linha)}
.btn.ghost:hover{background:#fff;border-color:var(--verde);color:var(--verde-d)}
.btn.sm{padding:7px 11px;font-size:12.5px}
.btn.dark{background:var(--dark)}.btn.dark:hover{background:#1f2028}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:var(--off);border:1px solid var(--linha);color:var(--txt);font-size:14px;margin-left:5px;transition:.12s;vertical-align:middle}
.btn-icon:hover{background:#fff;border-color:var(--verde);color:var(--verde-d)}
.btn-icon.danger:hover{border-color:var(--vermelho);color:var(--vermelho);background:#fff}
.login-screen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,rgba(39,174,96,.12),transparent),var(--off);padding:20px}
.login-card{width:100%;max-width:380px;background:#fff;border:1px solid var(--linha);border-radius:20px;padding:34px 30px;box-shadow:0 20px 60px rgba(46,47,57,.12);text-align:center}
.login-logo{width:52px;height:52px;border-radius:14px;background:var(--verde);color:#fff;font-weight:800;font-size:26px;display:grid;place-items:center;margin:0 auto 16px}
.login-tt{font-weight:700;font-size:19px;color:var(--dark)}
.login-sub{font-size:13.5px;color:var(--txt-2);margin:8px 0 20px;line-height:1.5}
.login-card input{width:100%;padding:12px 14px;border:1px solid var(--linha);border-radius:11px;font-size:14px;margin-bottom:12px;outline:none;font-family:inherit}
.login-card input:focus{border-color:var(--verde)}
.login-card .btn{width:100%;justify-content:center;padding:12px}
.login-note{font-size:12.5px;margin-top:14px;min-height:16px;line-height:1.45}
.login-note.ok{color:var(--verde-d)}
.login-note.err{color:var(--vermelho)}
.login-foot{font-size:11.5px;color:var(--txt-2);margin-top:18px;line-height:1.45}
.sync-info{color:var(--txt-2);font-size:11px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);padding:16px 17px;box-shadow:var(--sombra);position:relative;overflow:hidden}
.kpi .k-l{font-size:11.5px;color:var(--txt-2);font-weight:600;letter-spacing:.2px}
.kpi .k-v{font-size:27px;font-weight:700;margin-top:6px;letter-spacing:-.5px;line-height:1}
.kpi .k-s{font-size:11.5px;margin-top:6px;color:var(--txt-3);font-weight:500}
.kpi .k-tag{position:absolute;top:14px;right:14px;font-size:16px}
.kpi.accent{background:linear-gradient(135deg,var(--verde) 0%,var(--verde-d) 100%);border-color:transparent;color:#fff}
.kpi.accent .k-l,.kpi.accent .k-s{color:rgba(255,255,255,.82)}

/* progress */
.prog{height:10px;border-radius:20px;background:var(--cinza-l);overflow:hidden}
.prog>span{display:block;height:100%;background:linear-gradient(90deg,var(--verde),var(--verde-d));border-radius:20px;transition:width .5s}
.prog.big{height:14px}

/* status pill */
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;padding:4px 10px;border-radius:20px;white-space:nowrap}
.st .d{width:8px;height:8px;border-radius:50%;flex:none}
.st.concluido{background:var(--verde-l);color:var(--verde-d)} .st.concluido .d{background:var(--verde)}
.st.andamento{background:var(--azul-l);color:#1a5fc4} .st.andamento .d{background:var(--azul)}
.st.aguardando{background:var(--amarelo-l);color:#a9741a} .st.aguardando .d{background:var(--amarelo)}
.st.nao_iniciado{background:var(--cinza-l);color:var(--txt-2)} .st.nao_iniciado .d{background:#B9B9B0}
.st.atrasado{background:var(--vermelho-l);color:#b62c2c} .st.atrasado .d{background:var(--vermelho)}
.st.bloqueado{background:#E4E4E7;color:#3f3f46} .st.bloqueado .d{background:#3f3f46}

.prio{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.prio.alta{background:var(--vermelho-l);color:#b62c2c}
.prio.media{background:var(--amarelo-l);color:#a9741a}
.prio.baixa{background:var(--cinza-l);color:var(--txt-2)}

.mat{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.mat.alta{background:#F3E8FF;color:#7c3aed}
.mat.media{background:var(--azul-l);color:#1a5fc4}
.mat.baixa{background:var(--cinza-l);color:var(--txt-2)}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--linha);background:#fff;box-shadow:var(--sombra)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
table.tbl th{background:var(--off);text-align:left;padding:11px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--txt-2);font-weight:700;border-bottom:1px solid var(--linha);position:sticky;top:0;white-space:nowrap}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--linha-2);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr{transition:.1s}
table.tbl tbody tr:hover{background:var(--verde-l)}
table.tbl tr.clk{cursor:pointer}
.cell-strong{font-weight:600}
.cell-sub{color:var(--txt-3);font-size:11.5px}
td.num{font-family:'DM Mono',monospace;text-align:right;white-space:nowrap}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters select,.filters input{background:#fff;border:1px solid var(--linha);border-radius:9px;padding:8px 11px;outline:none;font-weight:500}
.filters select:focus,.filters input:focus{border-color:var(--verde)}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--linha);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--verde)}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.chip .n{background:rgba(0,0,0,.08);border-radius:10px;padding:0 6px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.2)}

/* grid helpers */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* gantt */
.gantt{overflow-x:auto;background:#fff;border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra)}
.gantt-inner{min-width:820px}
.gantt-row{display:grid;grid-template-columns:230px 1fr;border-bottom:1px solid var(--linha-2)}
.gantt-row:last-child{border-bottom:none}
.gantt-head{background:var(--off);position:sticky;top:0;z-index:2}
.gantt-lbl{padding:10px 14px;border-right:1px solid var(--linha);font-size:12.5px;font-weight:600;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
.gantt-lbl small{font-weight:500;color:var(--txt-3);font-size:11px}
.gantt-scale{display:flex;position:relative}
.gantt-day{flex:1;text-align:center;font-size:10px;padding:8px 0;color:var(--txt-3);border-right:1px solid var(--linha-2);min-width:28px}
.gantt-day.we{background:#faf9f4}
.gantt-track{position:relative;height:44px}
.gantt-cell{position:absolute;top:0;bottom:0;border-right:1px solid var(--linha-2)}
.gantt-bar{position:absolute;top:11px;height:22px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer}
.gantt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--vermelho);z-index:3}
.gantt-today::after{content:'hoje';position:absolute;top:-16px;left:-11px;font-size:9px;color:var(--vermelho);font-weight:700}

/* calendar */
.cal{background:#fff;border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra)}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);background:var(--off);border-bottom:1px solid var(--linha)}
.cal-head div{padding:9px;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--txt-2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:96px;border-right:1px solid var(--linha-2);border-bottom:1px solid var(--linha-2);padding:6px;font-size:12px;position:relative;overflow:hidden}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.out{background:#faf9f4;color:var(--txt-3)}
.cal-cell.today{background:var(--verde-l)}
.cal-cell .dn{font-weight:700;font-size:12px;margin-bottom:4px}
.cal-cell.today .dn{color:var(--verde-d)}
.cal-ev{font-size:10.5px;padding:2px 6px;border-radius:5px;margin-bottom:3px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* notif panel */
.notif-panel{position:fixed;top:60px;right:16px;width:360px;max-height:76vh;background:#fff;border:1px solid var(--linha);border-radius:14px;box-shadow:var(--sombra-2);z-index:60;overflow:hidden;display:none;flex-direction:column}
.notif-panel.open{display:flex}
.notif-head{padding:15px 18px;border-bottom:1px solid var(--linha);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.notif-list{overflow-y:auto;padding:8px}
.notif-item{display:flex;gap:11px;padding:11px 12px;border-radius:10px;cursor:pointer;transition:.1s}
.notif-item:hover{background:var(--off)}
.notif-item .ni{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:15px}
.notif-item .nt{font-weight:600;font-size:13px}
.notif-item .nd{color:var(--txt-3);font-size:11.5px;margin-top:2px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(30,31,38,.5);backdrop-filter:blur(3px);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--off);border-radius:18px;width:100%;max-width:760px;box-shadow:var(--sombra-2);animation:pop .22s ease;overflow:hidden}
.modal.sm{max-width:460px}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.modal-head{background:#fff;padding:20px 24px;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.modal-head h2{font-size:18px;font-weight:700;letter-spacing:-.2px}
.modal-head .mh-sub{color:var(--txt-3);font-size:12px;margin-top:3px;font-weight:500}
.modal-x{width:34px;height:34px;border-radius:9px;background:var(--off);display:grid;place-items:center;flex:none;transition:.12s}
.modal-x:hover{background:var(--vermelho-l);color:var(--vermelho)}
.modal-body{padding:22px 24px;max-height:64vh;overflow-y:auto}
.modal-foot{padding:15px 24px;background:#fff;border-top:1px solid var(--linha);display:flex;gap:10px;justify-content:flex-end}

.field{margin-bottom:15px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--txt-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.field input,.field select,.field textarea{width:100%;background:#fff;border:1px solid var(--linha);border-radius:10px;padding:10px 12px;outline:none;transition:.13s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-l)}
.field textarea{resize:vertical;min-height:64px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:640px){.field-row,.field-row-3{grid-template-columns:1fr}}

.detail-block{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:16px;margin-bottom:14px}
.detail-block h4{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--txt-2);margin-bottom:10px;font-weight:700}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.dl .di .k{font-size:11px;color:var(--txt-3);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.dl .di .v{font-weight:600;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--off);border:1px solid var(--linha);border-radius:7px;padding:3px 9px;font-size:12px;font-weight:600;font-family:'DM Mono',monospace}
.hist-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--linha)}
.hist-item:last-child{border-bottom:none}
.hist-item .hd{width:7px;height:7px;border-radius:50%;background:var(--verde);margin-top:6px;flex:none}
.hist-item .ht{font-size:12.5px}
.hist-item .hm{color:var(--txt-3);font-size:11px;font-family:'DM Mono',monospace}

.evid{display:flex;align-items:center;gap:9px;background:var(--off);border:1px solid var(--linha);border-radius:9px;padding:8px 11px;margin-bottom:7px;font-size:12.5px}
.evid .ei{width:26px;height:26px;border-radius:7px;background:var(--verde-l);color:var(--verde-d);display:grid;place-items:center;flex:none}
.evid .ex{margin-left:auto;color:var(--txt-3);cursor:pointer}
.evid .ex:hover{color:var(--vermelho)}

.empty{text-align:center;padding:44px 20px;color:var(--txt-3)}
.empty .ee{font-size:34px;margin-bottom:10px;opacity:.6}
.empty h3{color:var(--txt-2);font-size:15px;margin-bottom:5px}

.bar-list{display:flex;flex-direction:column;gap:12px}
.bar-item{display:grid;grid-template-columns:130px 1fr 42px;align-items:center;gap:12px}
.bar-item .bl{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:20px;background:var(--cinza-l);border-radius:6px;overflow:hidden}
.bar-track>span{display:block;height:100%;border-radius:6px;transition:width .5s}
.bar-item .bv{font-weight:700;text-align:right;font-family:'DM Mono',monospace}

/* ==========================================================================
   PERSISTÊNCIA + LOGIN
   - Sem chaves preenchidas → MODO LOCAL (localStorage), sem login. Para preview.
   - Com chaves preenchidas → MODO NUVEM (Supabase) + login por e-mail @allu.
   ========================================================================== */
let S=null;
let SESSAO_EMAIL='';
let sb=null;
if(CLOUD && window.supabase){ try{ sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }catch(e){ console.error('Supabase init:',e); } }

function loadLocal(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}const s=seed();try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}return s;}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

let _saveTimer=null;
function save(){
  saveLocal();                                   // backup local sempre
  if(!CLOUD||!sb||!S)return;
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(async()=>{
    try{
      const {error}=await sb.from(TABELA).upsert({id:LINHA_ID,conteudo:S,atualizado_em:new Date().toISOString(),atualizado_por:SESSAO_EMAIL});
      if(error)throw error;
      marcarSync('salvo');
    }catch(e){ marcarSync('erro'); console.error('Falha ao salvar na nuvem:',e); }
  },600);
}

async function carregarNuvem(){
  const {data,error}=await sb.from(TABELA).select('conteudo').eq('id',LINHA_ID).maybeSingle();
  if(error)throw error;
  if(data && data.conteudo){ S=data.conteudo; marcarSync('carregado'); }
  else{
    S=seed();
    const {error:e2}=await sb.from(TABELA).insert({id:LINHA_ID,conteudo:S,atualizado_em:new Date().toISOString(),atualizado_por:SESSAO_EMAIL});
    if(e2)throw e2;
    marcarSync('novo');
  }
}

function marcarSync(estado){
  const el=document.getElementById('syncInfo'); if(!el)return;
  if(!CLOUD){ el.textContent='Modo local (preview)'; return; }
  if(estado==='erro'){ el.textContent='⚠ falha ao salvar'; el.style.color='var(--vermelho)'; return; }
  el.style.color='';
  const hora=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  el.textContent='☁ '+(estado==='carregado'?'carregado':'salvo')+' '+hora+(SESSAO_EMAIL?' · '+SESSAO_EMAIL:'');
}
function comp(){return S.competencias[S.competenciaAtiva];}
function ativs(){return comp().atividades;}
function ativById(id){return ativs().find(a=>a.id===id);}
function contaByCod(c){return S.planoContas.find(p=>p.codigo===c);}
function me(){
  if(!S.usuarioAtual||!S.responsaveis.some(r=>r.nome===S.usuarioAtual))
    S.usuarioAtual=S.responsaveis[0]?S.responsaveis[0].nome:'';
  return S.usuarioAtual;
}
function initials(nome){return (nome||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';}

          ${k.agu?`<div class="alert-row y"><span class="ai">🟡</span><div><b>${k.agu} informação(ões) aguardando outras áreas</b><div class="cell-sub">Dependência de fornecedores</div></div></div>`:''}
          ${altMat?`<div class="alert-row b"><span class="ai">⚠️</span><div><b>${altMat} conta(s) de alta materialidade pendentes</b><div class="cell-sub">Exigem análise e evidência</div></div></div>`:''}
          <div class="alert-row g"><span class="ai">🟢</span><div><b>${k.concl} atividade(s) concluída(s)</b><div class="cell-sub">Com evidência anexada</div></div></div>

  prazoTag(a){const t=today();if(a.prazo<t)return `<span style="color:var(--vermelho)">${fmt(a.prazo)}</span>`;if(a.prazo===t)return `<span style="color:var(--amarelo)">Hoje</span>`;if(a.prazo===addDays(t,1))return `<span style="color:var(--azul)">Amanhã</span>`;return fmt(a.prazo);},

  /* ====================================================================
     DASHBOARD EXECUTIVO
     ==================================================================== */
  view_dashboard(){
    const k=this.kpis();const c=comp();
    const porArea=this.rankArea();
    return `
      <div class="page-head"><div><h1>Fechamento Contábil &amp; Fiscal</h1><p>Competência ${c.label} · SLA meta ${S.slaMeta} dias úteis</p></div>
      <button class="btn ghost" onclick="App.exportPDF()">Exportar PDF</button></div>

        <div class="kpi accent"><div class="k-l">Conclusão</div><div class="k-v">${k.pct}%</div><div class="k-s">${k.concl}/${k.total} atividades</div><span class="k-tag">📊</span></div>
        <div class="kpi"><div class="k-l">Dias úteis restantes</div><div class="k-v">${k.diasUteis}</div><div class="k-s">até ${fmt(k.prazo)}</div></div>
        <div class="kpi"><div class="k-l">Em andamento</div><div class="k-v">${k.and}</div><div class="k-s">iniciadas</div><span class="k-tag">🔵</span></div>
        <div class="kpi"><div class="k-l">Aguardando</div><div class="k-v">${k.agu}</div><div class="k-s">outras áreas</div><span class="k-tag">🟡</span></div>
        <div class="kpi"><div class="k-l">Atrasadas</div><div class="k-v" style="color:var(--vermelho)">${k.atr}</div><div class="k-s">${k.respPend} responsável(is) com pendência</div><span class="k-tag">🔴</span></div>
        <div class="kpi"><div class="k-l">Não iniciadas</div><div class="k-v">${k.nao}</div><div class="k-s">na fila</div><span class="k-tag">⚪</span></div>
      </div>

      <div class="grid-2">
        <div class="card card-pad">
          <div class="sec-title">Status do fechamento</div>
          ${this.donut(k)}
        </div>
        <div class="card card-pad">
          <div class="split-head"><div class="sec-title" style="margin:0">Ranking de pendências por área</div></div>
          <div class="bar-list">${porArea.map(r=>{
            const max=porArea[0].n||1;const w=Math.round(r.n/max*100);
            return `<div class="bar-item"><div class="bl">${r.area}</div><div class="bar-track"><span style="width:${w}%;background:${r.n>2?'var(--vermelho)':r.n>0?'var(--amarelo)':'var(--verde)'}"></span></div><div class="bv">${r.n}</div></div>`;
          }).join('')}</div>
        </div>
      </div>

      <div class="card card-pad" style="margin-top:16px">
        <div class="sec-title">Comparativo com competência anterior</div>
        ${this.compComparativo()}
      </div>`;
  },
  donut(k){
    const segs=[['concluido',k.concl],['andamento',k.and],['aguardando',k.agu],['nao_iniciado',k.nao],['atrasado',k.atr],['bloqueado',k.blo]].filter(s=>s[1]>0);
    const tot=k.total||1;let acc=0;const r=54,cir=2*Math.PI*r;
    const arcs=segs.map(([s,n])=>{const frac=n/tot;const dash=frac*cir;const el=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="${STATUS[s].cor}" stroke-width="20" stroke-dasharray="${dash} ${cir-dash}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`;acc+=dash;return el;}).join('');
    return `<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
      <svg width="140" height="140" viewBox="0 0 140 140" style="flex:none">${arcs}<text x="70" y="66" text-anchor="middle" font-size="26" font-weight="700" fill="#2E2F39">${k.pct}%</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="#9A9BA6">concluído</text></svg>
      <div style="flex:1;min-width:180px">${segs.map(([s,n])=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:13px"><span style="width:10px;height:10px;border-radius:3px;background:${STATUS[s].cor};flex:none"></span>${STATUS[s].lbl}<b style="margin-left:auto" class="mono">${n}</b></div>`).join('')}</div>
    </div>`;
  },
  rankArea(){
    const map={};S.areas.forEach(a=>map[a]=0);
    ativs().forEach(a=>{if(['atrasado','aguardando'].includes(effStatus(a))){map[a.areaFornecedora]=(map[a.areaFornecedora]||0)+1;}});
    return Object.entries(map).map(([area,n])=>({area,n})).sort((a,b)=>b.n-a.n);
  },
  compComparativo(){
    const keys=Object.keys(S.competencias).sort();const idx=keys.indexOf(S.competenciaAtiva);
    if(idx<=0)return '<p class="cell-sub">Sem competência anterior para comparação.</p>';
    const prev=S.competencias[keys[idx-1]];
    const pc=(cp)=>{const t=cp.atividades.length;const c=cp.atividades.filter(a=>a.status==='concluido').length;return t?Math.round(c/t*100):0;};
    const atr=(cp)=>cp.atividades.filter(a=>effStatus(a)==='atrasado').length;
    return `<div class="dl" style="grid-template-columns:repeat(3,1fr)">
      <div class="di"><div class="k">${prev.label} — conclusão</div><div class="v">${pc(prev)}%</div></div>
      <div class="di"><div class="k">${comp().label} — conclusão</div><div class="v">${pc(comp())}%</div></div>
      <div class="di"><div class="k">Atrasos (ant → atual)</div><div class="v">${atr(prev)} → <span style="color:${atr(comp())>atr(prev)?'var(--vermelho)':'var(--verde-d)'}">${atr(comp())}</span></div></div>
    </div>`;
  },

  /* ====================================================================
     CRONOGRAMA
     ==================================================================== */
  filteredAtivs(){
    const f=cronoFilters;
    return ativs().filter(a=>{
      if(f.area&&a.areaResponsavel!==f.area)return false;
      if(f.resp&&a.responsavelExec!==f.resp)return false;
      if(f.status&&effStatus(a)!==f.status)return false;
      if(f.prio&&a.prioridade!==f.prio)return false;
      if(f.etapa&&a.etapa!==f.etapa)return false;
      if(f.atrasadas&&effStatus(a)!=='atrasado')return false;
      if(f.q){const hay=(a.atividade+' '+a.descricao+' '+a.responsavelExec+' '+a.contas.join(' ')+' '+a.etapa).toLowerCase();if(!hay.includes(f.q))return false;}
      return true;
    });
  },
  view_cronograma(){
    const f=cronoFilters;const etapas=[...new Set(ativs().map(a=>a.etapa))];
    const rows=this.filteredAtivs().sort((a,b)=>a.prazo.localeCompare(b.prazo));
    const opt=(arr,sel)=>arr.map(v=>`<option value="${v}" ${v===sel?'selected':''}>${v}</option>`).join('');
    return `
      <div class="page-head"><div><h1>Cronograma de fechamento</h1><p>${rows.length} atividade(s) · ${comp().label}</p></div>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" onclick="App.exportExcel()">Excel</button>
        <button class="btn ghost" onclick="App.exportPDF()">PDF</button>
        <button class="btn" onclick="App.openAtiv('new')">+ Nova atividade</button>
      </div></div>

      <div class="filters">
        <select onchange="App.setFilter('etapa',this.value)"><option value="">Etapa</option>${opt(etapas,f.etapa)}</select>
        <select onchange="App.setFilter('area',this.value)"><option value="">Área</option>${opt(S.areas,f.area)}</select>
        <select onchange="App.setFilter('resp',this.value)"><option value="">Responsável</option>${opt(S.responsaveis.map(r=>r.nome),f.resp)}</select>
        <select onchange="App.setFilter('status',this.value)"><option value="">Status</option>${Object.keys(STATUS).map(s=>`<option value="${s}" ${s===f.status?'selected':''}>${STATUS[s].lbl}</option>`).join('')}</select>
        <select onchange="App.setFilter('prio',this.value)"><option value="">Prioridade</option>${opt(['alta','media','baixa'],f.prio)}</select>
        <button class="chip ${f.atrasadas?'on':''}" onclick="App.setFilter('atrasadas',${!f.atrasadas})">🔴 Somente atrasadas</button>
        ${(f.area||f.resp||f.status||f.prio||f.etapa||f.atrasadas||f.q)?`<button class="chip" onclick="App.clearFilters()">✕ Limpar</button>`:''}
      </div>

      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr><th>ID</th><th>Etapa</th><th>Atividade</th><th>Responsável</th><th>Área forn.</th><th>Início</th><th>Prazo</th><th>Prio</th><th>Contas</th><th>Status</th></tr></thead>
          <tbody>${rows.map(a=>`<tr class="clk" onclick="App.openAtiv(${a.id})">
            <td class="mono cell-sub">#${String(a.id).padStart(2,'0')}</td>
            <td><span class="cell-sub">${a.etapa}</span></td>
            <td class="cell-strong">${a.atividade}${a.dependencias.length?' <span class="cell-sub">⛓</span>':''}</td>
            <td>${a.responsavelExec}</td>
            <td class="cell-sub">${a.areaFornecedora}</td>
            <td class="cell-sub">${fmt(a.dataInicio)}</td>
            <td class="cell-strong">${this.prazoTag(a)}</td>
            <td><span class="prio ${a.prioridade}">${a.prioridade}</span></td>
            <td>${a.contas.length?`<span class="tag">${a.contas[0]}${a.contas.length>1?' +'+(a.contas.length-1):''}</span>`:'<span class="cell-sub">—</span>'}</td>
            <td>${stPill(a)}</td></tr>`).join('')||'<tr><td colspan=10 class="empty"><div class="ee">🔍</div><h3>Nenhuma atividade</h3>Ajuste os filtros.</td></tr>'}</tbody>
        </table>
      </div>`;
  },
  setFilter(k,v){cronoFilters[k]=v;this.go('cronograma');},
  clearFilters(){cronoFilters={area:'',resp:'',status:'',prio:'',etapa:'',atrasadas:false,q:''};document.getElementById('globalSearch').value='';this.go('cronograma');},

  /* ====================================================================
     GANTT
     ==================================================================== */
  view_gantt(){
    const c=comp();const A=ativs().slice().sort((a,b)=>a.dataInicio.localeCompare(b.dataInicio));
    let min=c.inicio,max=c.prazo;A.forEach(a=>{if(a.dataInicio<min)min=a.dataInicio;if(a.prazo>max)max=a.prazo;});
    const days=[];let d=min;while(d<=max){days.push(d);d=addDays(d,1);}const nd=days.length;
    const colW=`${100/nd}%`;
    const scale=days.map(dd=>`<div class="gantt-day ${isWeekend(dd)?'we':''}">${parse(dd).getDate()}</div>`).join('');
    const t=today();const tIdx=days.indexOf(t);
    const rows=A.map(a=>{
      const si=days.indexOf(a.dataInicio),ei=days.indexOf(a.prazo);
      const left=Math.max(0,si)/nd*100;const width=Math.max(1,(ei-Math.max(0,si)+1))/nd*100;
      const col=STATUS[effStatus(a)].cor;
      return `<div class="gantt-row"><div class="gantt-lbl" title="${a.atividade}">${a.atividade}<small>${a.responsavelExec}</small></div>
        <div class="gantt-track">
          ${days.map(dd=>`<div class="gantt-cell ${isWeekend(dd)?'we':''}" style="left:${days.indexOf(dd)/nd*100}%;width:${colW}"></div>`).join('')}
          ${tIdx>=0?`<div class="gantt-today" style="left:${(tIdx+0.5)/nd*100}%"></div>`:''}
          <div class="gantt-bar" style="left:${left}%;width:${width}%;background:${col}" onclick="App.openAtiv(${a.id})">${fmt(a.dataInicio)}–${fmt(a.prazo)}</div>
        </div></div>`;
    }).join('');
    return `<div class="page-head"><div><h1>Gantt — ${c.label}</h1><p>Linha do tempo do fechamento · barra colorida por status</p></div></div>
      <div class="gantt"><div class="gantt-inner">
        <div class="gantt-row gantt-head"><div class="gantt-lbl">Atividade</div><div class="gantt-scale">${scale}</div></div>
        ${rows}
      </div></div>
      <div class="mini-legend" style="margin-top:14px">${Object.keys(STATUS).map(s=>`<div><span class="d" style="background:${STATUS[s].cor}"></span>${STATUS[s].lbl}</div>`).join('')}</div>`;
  },

  /* ====================================================================
     CALENDÁRIO
     ==================================================================== */
  view_calendario(){
    const c=comp();const ref=parse(c.inicio);const y=ref.getFullYear(),m=ref.getMonth();
    const first=new Date(y,m,1);const start=new Date(first);start.setDate(1-((first.getDay()+6)%7)); // segunda-início
    const cells=[];for(let i=0;i<42;i++){const dd=new Date(start);dd.setDate(start.getDate()+i);cells.push(dd);}
    const byDay={};ativs().forEach(a=>{(byDay[a.prazo]=byDay[a.prazo]||[]).push(a);});
    const t=today();
    return `<div class="page-head"><div><h1>${MESES[m]}/${y}</h1><p>Prazos das atividades do fechamento</p></div></div>
      <div class="cal">
        <div class="cal-head">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=>`<div>${d}</div>`).join('')}</div>
        <div class="cal-grid">${cells.map(dd=>{
          const s=iso(dd);const out=dd.getMonth()!==m;const evs=byDay[s]||[];
          return `<div class="cal-cell ${out?'out':''} ${s===t?'today':''}">
            <div class="dn">${dd.getDate()}</div>
            ${evs.slice(0,3).map(a=>`<div class="cal-ev" style="background:${STATUS[effStatus(a)].cor}22;color:${STATUS[effStatus(a)].cor}" onclick="App.openAtiv(${a.id})">${a.atividade}</div>`).join('')}
            ${evs.length>3?`<div class="cell-sub" style="font-size:10px">+${evs.length-3} mais</div>`:''}
          </div>`;
        }).join('')}</div>
      </div>`;
  },

  /* ====================================================================
     PAINEL DA CONTROLADORIA (minhas pendências)
     ==================================================================== */
  view_painel(){
    const meNome=me();
    const minhas=ativs().filter(a=>a.responsavelExec===meNome);
    const t=today();
    const hoje=minhas.filter(a=>a.prazo===t&&effStatus(a)!=='concluido');
    const atr=minhas.filter(a=>effStatus(a)==='atrasado');
    const aguard=minhas.filter(a=>effStatus(a)==='aguardando');
    const concl=minhas.filter(a=>effStatus(a)==='concluido');
    const prox=minhas.filter(a=>effStatus(a)!=='concluido'&&a.prazo>t).sort((a,b)=>a.prazo.localeCompare(b.prazo));

    return `<div class="page-head"><div><h1>Minhas pendências</h1><p>${meNome} · Painel da Controladoria</p></div></div>
      <div class="kpis">
        <div class="kpi"><div class="k-l">Para hoje</div><div class="k-v">${hoje.length}</div></div>
        <div class="kpi"><div class="k-l">Atrasadas</div><div class="k-v" style="color:var(--vermelho)">${atr.length}</div></div>
        <div class="kpi"><div class="k-l">Aguardando info</div><div class="k-v">${aguard.length}</div></div>
        <div class="kpi accent"><div class="k-l">Concluídas</div><div class="k-v">${concl.length}</div></div>

  },

  /* ====================================================================

        </div>
      </div>`;

  /* ====================================================================
     INDICADORES & SLA
     ==================================================================== */
  view_indicadores(){
    const A=ativs();const k=this.kpis();
    const comEvid=A.filter(a=>a.evidencias.length).length;
    const noPrazo=A.filter(a=>a.status==='concluido'&&a.dataConclusao&&a.dataConclusao<=a.prazo).length;
    const foraPrazo=A.filter(a=>a.status==='concluido').length-noPrazo;
    const pctPrazo=A.filter(a=>a.status==='concluido').length?Math.round(noPrazo/A.filter(a=>a.status==='concluido').length*100):0;
    const pctEvid=k.total?Math.round(comEvid/k.total*100):0;
    const realizado=(S.slaMeta+0.4).toFixed(1);
    const porArea=this.rankArea();
    const porResp={};A.forEach(a=>{if(effStatus(a)==='atrasado'){porResp[a.responsavelExec]=(porResp[a.responsavelExec]||0)+1;}});
    const respRows=Object.entries(porResp).sort((a,b)=>b[1]-a[1]);
    return `<div class="page-head"><div><h1>Indicadores do fechamento</h1><p>Performance da competência ${comp().label}</p></div>
      <button class="btn ghost" onclick="App.exportPDF()">Exportar PDF</button></div>
      <div class="kpis">
        <div class="kpi"><div class="k-l">% concluído no prazo</div><div class="k-v">${pctPrazo}%</div><div class="k-s">${noPrazo} no prazo · ${foraPrazo} fora</div></div>
        <div class="kpi"><div class="k-l">% com evidência</div><div class="k-v">${pctEvid}%</div><div class="k-s">${comEvid}/${k.total}</div></div>
        <div class="kpi"><div class="k-l">Atrasadas</div><div class="k-v" style="color:${k.atr?'var(--vermelho)':'inherit'}">${k.atr}</div></div>
        <div class="kpi"><div class="k-l">Info fora do prazo</div><div class="k-v">${foraPrazo}</div></div>
      </div>
      <div class="grid-2">
        <div class="card card-pad">
          <div class="sec-title">SLA do fechamento</div>
          <div style="display:flex;gap:20px;flex-wrap:wrap">
            <div><div class="cell-sub">Meta</div><div style="font-size:28px;font-weight:700">${S.slaMeta} <span style="font-size:13px;color:var(--txt-3)">dias úteis</span></div></div>
            <div><div class="cell-sub">Realizado</div><div style="font-size:28px;font-weight:700;color:var(--amarelo)">${realizado} <span style="font-size:13px;color:var(--txt-3)">dias</span></div></div>
            <div><div class="cell-sub">Status</div><div style="font-size:20px;font-weight:700;color:var(--amarelo);margin-top:5px">⚠️ Acima da meta</div></div>
          </div>
          <div class="prog" style="margin-top:14px"><span style="width:${Math.min(100,S.slaMeta/realizado*100)}%;background:var(--amarelo)"></span></div>
        </div>
        <div class="card card-pad">
          <div class="sec-title">Pendências por responsável</div>
          ${respRows.length?respRows.map(([n,v])=>`<div class="bar-item"><div class="bl">${n}</div><div class="bar-track"><span style="width:${v/respRows[0][1]*100}%;background:var(--vermelho)"></span></div><div class="bv">${v}</div></div>`).join(''):'<p class="cell-sub">Sem responsáveis com atraso 🎉</p>'}
        </div>
      </div>
      <div class="card card-pad" style="margin-top:16px">
        <div class="sec-title">Pendências por área</div>
        <div class="bar-list">${porArea.filter(r=>r.n>0).map(r=>`<div class="bar-item"><div class="bl">${r.area}</div><div class="bar-track"><span style="width:${r.n/(porArea[0].n||1)*100}%;background:var(--dark)"></span></div><div class="bv">${r.n}</div></div>`).join('')||'<p class="cell-sub">Nenhuma pendência por área.</p>'}</div>
      </div>`;
  },

  /* ====================================================================
     MODAL — ATIVIDADE (detalhe + edição)
     ==================================================================== */
  _editMode:false,
  openAtiv(id){
    this._editMode=false;
    if(id==='new'){this._editMode=true;this.renderAtivForm(null);this.openModal();return;}
    this.renderAtivDetail(ativById(id));this.openModal();
  },
  renderAtivDetail(a){
    const deps=a.dependencias.map(d=>{const dd=ativById(d);return dd?`<span class="tag" style="font-family:'DM Sans'">${dd.atividade} ${effStatus(dd)==='concluido'?'✓':'⏳'}</span>`:'';}).join('');
    const contasHtml=a.contas.map(c=>{const p=contaByCod(c);return `<span class="tag" title="${p?p.nome:''}">${c}</span>`;}).join('')||'<span class="cell-sub">Nenhuma conta vinculada</span>';
    const canConclude=this.depsOk(a);
    document.getElementById('modal').innerHTML=`
      <div class="modal-head"><div><h2>${a.atividade}</h2><div class="mh-sub">#${String(a.id).padStart(2,'0')} · ${a.etapa} · ${comp().label}</div></div>
      <button class="modal-x" onclick="App.closeModal()">✕</button></div>
      <div class="modal-body">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center">
          ${stPill(a)} <span class="prio ${a.prioridade}">Prioridade ${a.prioridade}</span>
          <span style="margin-left:auto;display:flex;gap:8px">
            <button class="btn ghost sm" onclick="App.renderAtivForm(${a.id});">Editar</button>
            ${a.status!=='concluido'?`<button class="btn sm" onclick="App.concluir(${a.id})">✓ Marcar como concluído</button>`:''}
          </span>
        </div>
        <div class="detail-block"><p>${a.descricao||'Sem descrição.'}</p></div>
        <div class="detail-block"><h4>Informações</h4><div class="dl">
          <div class="di"><div class="k">Responsável (executa)</div><div class="v">${a.responsavelExec}</div></div>
          <div class="di"><div class="k">Área responsável</div><div class="v">${a.areaResponsavel}</div></div>
          <div class="di"><div class="k">Área fornecedora</div><div class="v">${a.areaFornecedora}</div></div>
          <div class="di"><div class="k">Responsável pelo envio</div><div class="v">${a.responsavelEnvio}</div></div>
          <div class="di"><div class="k">Aprovador</div><div class="v">${a.aprovador}</div></div>
          <div class="di"><div class="k">Centro de custo</div><div class="v">${a.centroCusto||'—'}</div></div>
          <div class="di"><div class="k">Início</div><div class="v">${fmtFull(a.dataInicio)}</div></div>
          <div class="di"><div class="k">Prazo</div><div class="v">${fmtFull(a.prazo)}</div></div>
        </div></div>
        <div class="detail-block"><h4>Contas contábeis vinculadas</h4><div class="tags">${contasHtml}</div></div>
        ${a.dependencias.length?`<div class="detail-block"><h4>Dependências ${canConclude?'':'<span style="color:var(--vermelho)">(pendentes)</span>'}</h4><div class="tags">${deps}</div></div>`:''}
        <div class="detail-block"><h4>Evidências ${a.evidObrig?'<span class="cell-sub">(obrigatória)</span>':''}</h4>
          ${a.evidencias.map((e,i)=>`<div class="evid"><span class="ei">📎</span>${e.nome}<span class="cell-sub" style="margin-left:auto">${e.data}</span><span class="ex" onclick="App.rmEvid(${a.id},${i})">✕</span></div>`).join('')||'<p class="cell-sub">Nenhuma evidência anexada.</p>'}
          <button class="btn ghost sm" style="margin-top:8px" onclick="App.addEvid(${a.id})">📎 Anexar evidência</button>
        </div>
        <div class="detail-block"><h4>Observações</h4>
          <textarea id="obsField" placeholder="Registrar ocorrências…" style="width:100%;border:1px solid var(--linha);border-radius:10px;padding:10px;min-height:52px">${a.obs||''}</textarea>
          <button class="btn ghost sm" style="margin-top:8px" onclick="App.saveObs(${a.id})">Salvar observação</button>
        </div>
        <div class="detail-block"><h4>Histórico</h4>
          ${a.historico.slice().reverse().map(h=>`<div class="hist-item"><span class="hd"></span><div><div class="ht"><b>${h.quem}</b> — ${h.acao}${h.de?` (${STATUS[h.de]?STATUS[h.de].lbl:h.de} → ${STATUS[h.para]?STATUS[h.para].lbl:h.para})`:''}</div><div class="hm">${h.data}</div></div></div>`).join('')}
        </div>
      </div>`;
  },
  depsOk(a){return a.dependencias.every(d=>{const dd=ativById(d);return !dd||dd.status==='concluido';});},

  renderAtivForm(id){
    const a=id?ativById(id):{id:'new',etapa:'',atividade:'',descricao:'',dataInicio:today(),prazo:addDays(today(),3),responsavelExec:S.responsaveis[0].nome,areaResponsavel:S.areas[0],areaFornecedora:S.areas[0],responsavelEnvio:S.responsaveis[0].nome,aprovador:S.responsaveis[0].nome,status:'nao_iniciado',prioridade:'media',contas:[],centroCusto:'',dependencias:[],evidObrig:true};
    const so=(arr,sel)=>arr.map(v=>`<option value="${v}" ${v===sel?'selected':''}>${v}</option>`).join('');
    const respNames=S.responsaveis.map(r=>r.nome);
    document.getElementById('modal').innerHTML=`
      <div class="modal-head"><div><h2>${id?'Editar atividade':'Nova atividade'}</h2><div class="mh-sub">${comp().label}</div></div>
      <button class="modal-x" onclick="App.closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>Atividade</label><input id="f_atividade" value="${a.atividade}" list="bancoList" placeholder="Ex.: Conciliação bancária"><datalist id="bancoList">${S.bancoAtividades.map(b=>`<option>${b}</option>`).join('')}</datalist></div>
        <div class="field-row"><div class="field"><label>Etapa</label><input id="f_etapa" value="${a.etapa}" placeholder="Ex.: Conciliações"></div>
        <div class="field"><label>Prioridade</label><select id="f_prio">${so(['alta','media','baixa'],a.prioridade)}</select></div></div>
        <div class="field"><label>Descrição</label><textarea id="f_desc">${a.descricao}</textarea></div>
        <div class="field-row"><div class="field"><label>Data de início</label><input type="date" id="f_ini" value="${a.dataInicio}"></div>
        <div class="field"><label>Prazo final</label><input type="date" id="f_prazo" value="${a.prazo}"></div></div>
        <div class="field-row"><div class="field"><label>Responsável (executa)</label><select id="f_resp">${so(respNames,a.responsavelExec)}</select></div>
        <div class="field"><label>Área responsável</label><select id="f_area">${so(S.areas,a.areaResponsavel)}</select></div></div>
        <div class="field-row"><div class="field"><label>Área fornecedora</label><select id="f_areaf">${so(S.areas,a.areaFornecedora)}</select></div>
        <div class="field"><label>Responsável pelo envio</label><select id="f_respenvio">${so(respNames,a.responsavelEnvio)}</select></div></div>
        <div class="field-row"><div class="field"><label>Aprovador</label><select id="f_aprov">${so(respNames,a.aprovador)}</select></div>
        <div class="field"><label>Status</label><select id="f_status">${Object.keys(STATUS).map(s=>`<option value="${s}" ${s===a.status?'selected':''}>${STATUS[s].lbl}</option>`).join('')}</select></div></div>
        <div class="field-row"><div class="field"><label>Centro de custo</label><input id="f_cc" value="${a.centroCusto}"></div>
        <div class="field"><label>Evidência obrigatória?</label><select id="f_evidobrig"><option value="1" ${a.evidObrig?'selected':''}>Sim</option><option value="0" ${!a.evidObrig?'selected':''}>Não</option></select></div></div>
        <div class="field"><label>Contas contábeis (múltiplas)</label>
          <select id="f_contas" multiple size="5" style="height:auto">${S.planoContas.map(p=>`<option value="${p.codigo}" ${a.contas.includes(p.codigo)?'selected':''}>${p.codigo} — ${p.nome}</option>`).join('')}</select></div>
        <div class="field"><label>Dependências (atividades que precisam ser concluídas antes)</label>
          <select id="f_deps" multiple size="4" style="height:auto">${ativs().filter(x=>x.id!==a.id).map(x=>`<option value="${x.id}" ${a.dependencias.includes(x.id)?'selected':''}>#${x.id} — ${x.atividade}</option>`).join('')}</select></div>
      </div>
      <div class="modal-foot">
        ${id?`<button class="btn ghost" style="margin-right:auto;color:var(--vermelho)" onclick="App.delAtiv(${id})">Excluir</button>`:''}

        <button class="btn" onclick="App.saveAtiv(${id||'null'})">Salvar</button>
      </div>`;
  },
  saveAtiv(id){
    const g=x=>document.getElementById(x);
    const getMulti=x=>[...g(x).selectedOptions].map(o=>o.value);
    const data={
      etapa:g('f_etapa').value||'Geral', atividade:g('f_atividade').value||'Atividade sem nome',
      descricao:g('f_desc').value, dataInicio:g('f_ini').value, prazo:g('f_prazo').value,
      responsavelExec:g('f_resp').value, areaResponsavel:g('f_area').value, areaFornecedora:g('f_areaf').value,
      responsavelEnvio:g('f_respenvio').value, aprovador:g('f_aprov').value, status:g('f_status').value,
      prioridade:g('f_prio').value, centroCusto:g('f_cc').value, evidObrig:g('f_evidobrig').value==='1',
      contas:getMulti('f_contas'), dependencias:getMulti('f_deps').map(Number),
      ultimaAtualizacao:nowStamp()
    };
    const A=ativs();
    if(id){const a=ativById(id);const antigo=a.status;Object.assign(a,data);
      if(antigo!==data.status)a.historico.push({quem:'Controladoria',acao:'Status alterado',de:antigo,para:data.status,data:nowStamp(),obs:''});
      else a.historico.push({quem:'Controladoria',acao:'Atividade editada',de:'',para:'',data:nowStamp(),obs:''});
    }else{
      const nid=Math.max(0,...A.map(a=>a.id))+1;
      A.push(Object.assign({id:nid,evidencias:[],dataConclusao:'',raci:{R:data.responsavelExec,A:data.aprovador,C:data.responsavelEnvio,I:'Isa Rocha'},lembretes:['D-2','D-1','D0'],historico:[{quem:'Controladoria',acao:'Atividade criada',de:'',para:data.status,data:nowStamp(),obs:''}]},data));
    }
    save();this.toast(id?'Atividade atualizada':'Atividade criada');this.closeModal();this.go(currentView);this.refreshNotif();
  },
  delAtiv(id){if(!confirm('Excluir esta atividade?'))return;comp().atividades=ativs().filter(a=>a.id!==id);save();this.closeModal();this.go(currentView);this.refreshNotif();this.toast('Atividade excluída');},
  concluir(id){
    const a=ativById(id);
    if(!this.depsOk(a)){if(!confirm('⚠️ Existem dependências não concluídas. Concluir mesmo assim?'))return;}
    if(a.evidObrig&&!a.evidencias.length){
      if(confirm('Esta atividade exige evidência. Deseja anexar agora?')){this.addEvid(id,true);return;}
      return;
    }
    const de=a.status;a.status='concluido';a.dataConclusao=today();a.ultimaAtualizacao=nowStamp();
    a.historico.push({quem:'Controladoria',acao:'Concluída',de,para:'concluido',data:nowStamp(),obs:''});
    save();this.toast('✓ Atividade concluída');this.renderAtivDetail(a);this.go(currentView);this.refreshNotif();
  },
  addEvid(id,thenConclude){
    const nome=prompt('Nome do arquivo de evidência (ex.: conciliacao_bancaria.xlsx):');if(!nome)return;
    const a=ativById(id);a.evidencias.push({nome,data:nowStamp()});
    a.historico.push({quem:'Controladoria',acao:'Evidência anexada: '+nome,de:'',para:'',data:nowStamp(),obs:''});
    save();if(thenConclude){this.concluir(id);}else{this.renderAtivDetail(a);this.toast('Evidência anexada');}
  },
  rmEvid(id,i){const a=ativById(id);a.evidencias.splice(i,1);save();this.renderAtivDetail(a);},
  saveObs(id){const a=ativById(id);a.obs=document.getElementById('obsField').value;a.historico.push({quem:'Controladoria',acao:'Observação registrada',de:'',para:'',data:nowStamp(),obs:''});save();this.toast('Observação salva');},

  /* ---------- MODAL CONTA ---------- */
  openConta(cod){
    const p=cod==='new'?{codigo:'',nome:'',tipo:'analitica',grupo:'',subgrupo:'',natureza:'Devedora',centroResultado:'',areaResponsavel:S.areas[0],responsavelAnalise:S.responsaveis[0].nome,frequencia:'Mensal',materialidade:'media',obs:''}:contaByCod(cod);
    const so=(arr,sel)=>arr.map(v=>`<option ${v===sel?'selected':''}>${v}</option>`).join('');
    document.getElementById('modal').innerHTML=`
      <div class="modal-head"><div><h2>${cod==='new'?'Nova conta':p.codigo}</h2><div class="mh-sub">Plano de contas</div></div><button class="modal-x" onclick="App.closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="field-row"><div class="field"><label>Código</label><input id="c_cod" value="${p.codigo}" class="mono"></div>
        <div class="field"><label>Tipo</label><select id="c_tipo">${so(['analitica','sintetica'],p.tipo)}</select></div></div>
        <div class="field"><label>Nome da conta</label><input id="c_nome" value="${p.nome}"></div>
        <div class="field-row"><div class="field"><label>Grupo</label><input id="c_grupo" value="${p.grupo}"></div>
        <div class="field"><label>Subgrupo</label><input id="c_sub" value="${p.subgrupo}"></div></div>
        <div class="field-row"><div class="field"><label>Natureza</label><select id="c_nat">${so(['Devedora','Credora'],p.natureza)}</select></div>
        <div class="field"><label>Materialidade</label><select id="c_mat">${so(['alta','media','baixa'],p.materialidade)}</select></div></div>
        <div class="field-row"><div class="field"><label>Área responsável</label><select id="c_area">${so(S.areas,p.areaResponsavel)}</select></div>
        <div class="field"><label>Responsável análise</label><select id="c_resp">${so(S.responsaveis.map(r=>r.nome),p.responsavelAnalise)}</select></div></div>
        <div class="field"><label>Observações</label><textarea id="c_obs">${p.obs}</textarea></div>
      </div>
      <div class="modal-foot">${cod!=='new'?`<button class="btn ghost" style="margin-right:auto;color:var(--vermelho)" onclick="App.delConta('${cod}')">Excluir</button>`:''}
      <button class="btn ghost" onclick="App.closeModal()">Cancelar</button><button class="btn" onclick="App.saveConta('${cod}')">Salvar</button></div>`;
    this.openModal();
  },
  saveConta(cod){const g=x=>document.getElementById(x).value;
    const nova={codigo:g('c_cod'),nome:g('c_nome'),tipo:g('c_tipo'),grupo:g('c_grupo'),subgrupo:g('c_sub'),natureza:g('c_nat'),centroResultado:'',areaResponsavel:g('c_area'),responsavelAnalise:g('c_resp'),frequencia:'Mensal',materialidade:g('c_mat'),obs:g('c_obs')};
    if(cod==='new')S.planoContas.push(nova);else{const i=S.planoContas.findIndex(p=>p.codigo===cod);S.planoContas[i]=nova;}
    save();this.closeModal();this.go(currentView);this.toast('Conta salva');},
  delConta(cod){if(!confirm('Excluir conta?'))return;S.planoContas=S.planoContas.filter(p=>p.codigo!==cod);save();this.closeModal();this.go(currentView);},
  importPlano(){
    document.getElementById('modal').innerHTML=`
      <div class="modal-head"><div><h2>Importar plano de contas</h2><div class="mh-sub">Colar do Excel / SAP</div></div><button class="modal-x" onclick="App.closeModal()">✕</button></div>
      <div class="modal-body">
        <p class="cell-sub" style="margin-bottom:10px;line-height:1.5">Cole <b>uma conta por linha</b>, com as colunas na ordem <b>Código · Nome · Grupo · Natureza</b> (separadas por TAB, ponto-e-vírgula ou vírgula). Só <b>Código</b> e <b>Nome</b> são obrigatórios — o resto é opcional.</p>
        <textarea id="imp_txt" style="min-height:200px;font-family:'DM Mono',monospace;font-size:12.5px" placeholder="Ex.:  1.1.01;Caixa e equivalentes;Ativo Circulante;Devedora"></textarea>
        <label style="display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;cursor:pointer"><input type="checkbox" id="imp_sub" style="width:16px;height:16px;accent-color:var(--verde)"> Substituir TODO o plano atual (apaga as contas de hoje antes de importar)</label>
      </div>
      <div class="modal-foot"><button class="btn ghost" onclick="App.closeModal()">Cancelar</button><button class="btn" onclick="App.salvarImportPlano()">Importar</button></div>`;
    this.openModal();
  },
  salvarImportPlano(){
    const txt=document.getElementById('imp_txt').value||'';
    const sub=document.getElementById('imp_sub').checked;
    const linhas=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    if(!linhas.length){alert('Cole ao menos uma linha.');return;}
    const novas=[];
    linhas.forEach(l=>{
      const c=l.split(/\t|;|,/).map(x=>x.trim());
      if(!c[0]||!c[1])return;
      const nat=/cred/i.test(c[3]||'')?'Credora':'Devedora';
      novas.push({codigo:c[0],nome:c[1],tipo:'analitica',grupo:c[2]||'',subgrupo:'',natureza:nat,centroResultado:'',areaResponsavel:S.areas[0],responsavelAnalise:(S.responsaveis[0]?S.responsaveis[0].nome:''),frequencia:'Mensal',materialidade:'media',obs:''});
    });
    if(!novas.length){alert('Nenhuma linha válida. Cada linha precisa ter pelo menos Código e Nome.');return;}
    if(sub){S.planoContas=novas;}
    else{const map={};S.planoContas.forEach(p=>map[p.codigo]=p);novas.forEach(n=>map[n.codigo]=n);S.planoContas=Object.values(map);}
    save();this.closeModal();this.go('plano');this.toast(novas.length+' conta(s) importada(s)');
  },
  limparPlano(){
    if(!confirm('Apagar TODAS as contas do plano de contas?\n\nIsso não apaga as atividades, mas remove os vínculos de conta. Você poderá importar um plano novo em seguida.'))return;
    S.planoContas=[];save();this.go('plano');this.toast('Plano de contas apagado');
  },

  /* ---------- MODAL RESPONSÁVEL ---------- */
  openResp(i){
    const r=i==='new'?{nome:'',cargo:'',area:S.areas[0],email:'',gestor:''}:S.responsaveis[i];
    const so=(arr,sel)=>arr.map(v=>`<option ${v===sel?'selected':''}>${v}</option>`).join('');
    document.getElementById('modal').innerHTML=`<div class="modal-head"><div><h2>${i==='new'?'Novo responsável':r.nome}</h2><div class="mh-sub">Cadastro</div></div><button class="modal-x" onclick="App.closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>Nome</label><input id="r_nome" value="${r.nome}"></div>
        <div class="field-row"><div class="field"><label>Cargo</label><input id="r_cargo" value="${r.cargo}"></div>
        <div class="field"><label>Área</label><select id="r_area">${so(S.areas,r.area)}</select></div></div>
        <div class="field-row"><div class="field"><label>E-mail</label><input id="r_email" value="${r.email}"></div>
        <div class="field"><label>Gestor</label><input id="r_gestor" value="${r.gestor}"></div></div>
      </div>
      <div class="modal-foot">${i!=='new'?`<button class="btn ghost" style="margin-right:auto;color:var(--vermelho)" onclick="App.delResp(${i})">Excluir</button>`:''}
      <button class="btn ghost" onclick="App.closeModal()">Cancelar</button><button class="btn" onclick="App.saveResp(${i==='new'?"'new'":i})">Salvar</button></div>`;
    this.openModal();
  },
  saveResp(i){const g=x=>document.getElementById(x).value;const r={nome:g('r_nome'),cargo:g('r_cargo'),area:g('r_area'),email:g('r_email'),gestor:g('r_gestor')};
    if(i==='new')S.responsaveis.push(r);else S.responsaveis[i]=r;save();this.renderUserSelect();this.closeModal();this.go(currentView);this.toast('Responsável salvo');},
  delResp(i){
    const r=S.responsaveis[i];if(!r)return;
    let vinc=0;Object.values(S.competencias).forEach(c=>(c.atividades||[]).forEach(a=>{if([a.responsavelExec,a.responsavelEnvio,a.aprovador].includes(r.nome))vinc++;}));
    const msg=vinc?`${r.nome} está vinculado(a) a ${vinc} atividade(s) em uma ou mais competências.\nAs atividades continuarão com o nome registrado, mas ele(a) deixará de aparecer nas listas de seleção.\n\nExcluir mesmo assim?`:`Excluir ${r.nome}?`;
    if(!confirm(msg))return;
    S.responsaveis.splice(i,1);
    if(!S.responsaveis.some(x=>x.nome===S.usuarioAtual))S.usuarioAtual=S.responsaveis[0]?S.responsaveis[0].nome:'';
    save();this.renderUserSelect();this.closeModal();this.go(currentView);this.toast('Responsável excluído');},

  /* ---------- REVISÃO / BANCO ---------- */
  openRevisao(i){
    const rev=S.revisaoAnalitica[S.competenciaAtiva]||[];
    const r=i==='new'?{conta:'',variacao:'',justificativa:'',responsavel:me(),status:'nao_iniciado'}:rev[i];
    const so=(arr,sel)=>arr.map(v=>`<option ${v===sel?'selected':''}>${v}</option>`).join('');
    const stOpts=['nao_iniciado','andamento','concluido'].map(s=>`<option value="${s}" ${s===r.status?'selected':''}>${STATUS[s].lbl}</option>`).join('');
    const contaOpts=`<option value="">— selecione a conta —</option>`+S.planoContas.map(p=>`<option value="${p.codigo}" ${p.codigo===r.conta?'selected':''}>${p.codigo} · ${p.nome}</option>`).join('');
    document.getElementById('modal').innerHTML=`
      <div class="modal-head"><div><h2>${i==='new'?'Nova variação':'Editar variação'}</h2><div class="mh-sub">Revisão analítica · ${comp().label}</div></div><button class="modal-x" onclick="App.closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>Conta</label><select id="rv_conta">${contaOpts}</select></div>
        <div class="field-row"><div class="field"><label>Variação</label><input id="rv_var" value="${r.variacao}" placeholder="ex.: +5,2%"></div>
        <div class="field"><label>Status</label><select id="rv_status">${stOpts}</select></div></div>
        <div class="field"><label>Responsável</label><select id="rv_resp">${so(S.responsaveis.map(x=>x.nome),r.responsavel)}</select></div>
        <div class="field"><label>Justificativa</label><textarea id="rv_just">${r.justificativa}</textarea></div>
      </div>
      <div class="modal-foot">${i!=='new'?`<button class="btn ghost" style="margin-right:auto;color:var(--vermelho)" onclick="App.delRevisao(${i})">Excluir</button>`:''}
      <button class="btn ghost" onclick="App.closeModal()">Cancelar</button><button class="btn" onclick="App.saveRevisao(${i==='new'?"'new'":i})">Salvar</button></div>`;
    this.openModal();
  },
  saveRevisao(i){
    const g=x=>document.getElementById(x).value;
    const item={conta:g('rv_conta'),variacao:g('rv_var')||'—',justificativa:g('rv_just'),responsavel:g('rv_resp'),status:g('rv_status')};
    if(!item.conta){alert('Selecione uma conta.');return;}
    const arr=(S.revisaoAnalitica[S.competenciaAtiva]=S.revisaoAnalitica[S.competenciaAtiva]||[]);
    if(i==='new')arr.push(item);else arr[i]=item;
    save();this.closeModal();this.go('revisao');this.toast('Variação salva');
  },
  delRevisao(i){
    if(!confirm('Excluir esta variação?'))return;
    (S.revisaoAnalitica[S.competenciaAtiva]||[]).splice(i,1);
    save();this.closeModal();this.go('revisao');this.toast('Variação excluída');
  },
  addBanco(){const n=prompt('Nome da atividade padrão:');if(!n)return;S.bancoAtividades.push(n);save();this.go('config');},
  rmBanco(i){S.bancoAtividades.splice(i,1);save();this.go('config');},

  /* ---------- NOVO FECHAMENTO / DUPLICAR ---------- */
  duplicarFechamento(){
    const target=document.getElementById('dupComp').value;
    if(S.competencias[target]&&!confirm(`${compLabel(target)} já existe. Sobrescrever?`))return;
    const src=comp();const shift=(parse(target+'-01').getFullYear()-parse(S.competenciaAtiva+'-01').getFullYear())*12+(parse(target+'-01').getMonth()-parse(S.competenciaAtiva+'-01').getMonth());
    const nova=JSON.parse(JSON.stringify(src));
    nova.key=target;nova.label=compLabel(target);nova.encerrado=false;
    nova.inicio=this.shiftDate(src.inicio,shift);nova.prazo=this.shiftDate(src.prazo,shift);
    nova.atividades.forEach(a=>{a.dataInicio=this.shiftDate(a.dataInicio,shift);a.prazo=this.shiftDate(a.prazo,shift);a.status='nao_iniciado';a.dataConclusao='';a.evidencias=[];a.obs='';a.ultimaAtualizacao=nowStamp();a.historico=[{quem:'Sistema',acao:'Atividade criada (duplicada de '+src.label+')',de:'',para:'nao_iniciado',data:nowStamp(),obs:''}];});
    S.competencias[target]=nova;S.competenciaAtiva=target;save();this.renderCompSelect();document.getElementById('compSelect').value=target;this.renderNav();this.go('home');this.refreshNotif();this.toast('Fechamento '+nova.label+' criado');
  },
  shiftDate(s,months){const d=parse(s);d.setMonth(d.getMonth()+months);return iso(d);},
  encerrarFechamento(){const k=this.kpis();if(k.pct<100&&!confirm(`Fechamento está em ${k.pct}%. Encerrar mesmo assim?`))return;comp().encerrado=true;save();this.go('config');this.toast('Fechamento encerrado');},

  /* ====================================================================
     NOTIFICAÇÕES
     ==================================================================== */
  toggleNotif(){document.getElementById('notifPanel').classList.toggle('open');},
  buildNotifs(){
    const A=ativs();const t=today();const out=[];
    const atr=A.filter(a=>effStatus(a)==='atrasado');
    const amanha=A.filter(a=>a.prazo===addDays(t,1)&&effStatus(a)!=='concluido');
    const aguard=A.filter(a=>effStatus(a)==='aguardando');
    const concl=A.filter(a=>effStatus(a)==='concluido');
    if(atr.length)out.push({ic:'🔴',bg:'var(--vermelho-l)',t:`${atr.length} atividade(s) atrasada(s)`,d:atr.map(a=>a.atividade).slice(0,2).join(', '),go:atr[0].id});
    if(amanha.length)out.push({ic:'🟡',bg:'var(--amarelo-l)',t:`${amanha.length} atividade(s) vencem amanhã`,d:amanha.map(a=>a.atividade).slice(0,2).join(', '),go:amanha[0].id});
    if(aguard.length)out.push({ic:'🔵',bg:'var(--azul-l)',t:`${aguard.length} informação(ões) aguardando envio`,d:aguard.map(a=>a.areaFornecedora).slice(0,2).join(', '),go:aguard[0].id});
    if(concl.length)out.push({ic:'🟢',bg:'var(--verde-l)',t:`${concl.length} atividade(s) concluída(s)`,d:'Com evidência anexada',go:concl[0].id});
    return out;
  },
  refreshNotif(){
    const n=this.buildNotifs();
    document.getElementById('notifDot').style.display=this.kpis().atr>0?'block':'none';
    document.getElementById('notifList').innerHTML=n.map(x=>`<div class="notif-item" onclick="App.toggleNotif();App.openAtiv(${x.go})"><div class="ni" style="background:${x.bg}">${x.ic}</div><div><div class="nt">${x.t}</div><div class="nd">${x.d}</div></div></div>`).join('')||'<div class="empty" style="padding:30px">Sem notificações.</div>';
    document.querySelectorAll('#nav a').forEach(a=>{const id=a.dataset.v;const b=this.navBadge(id);const old=a.querySelector('.badge');if(old)old.remove();if(b)a.insertAdjacentHTML('beforeend',b);});
  },

  /* ====================================================================
     EXPORTAÇÃO
     ==================================================================== */
  exportPDF(){window.print();},
  exportExcel(){
    this.toast('Preparando Excel…');
    const build=()=>{
      const XLSX=window.XLSX;const wb=XLSX.utils.book_new();
      const crono=this.filteredAtivs().map(a=>({ID:a.id,Etapa:a.etapa,Atividade:a.atividade,Descrição:a.descricao,Início:fmtFull(a.dataInicio),Prazo:fmtFull(a.prazo),'Responsável':a.responsavelExec,'Área resp.':a.areaResponsavel,'Área forn.':a.areaFornecedora,'Envio':a.responsavelEnvio,Prioridade:a.prioridade,Contas:a.contas.join(', '),Status:STATUS[effStatus(a)].lbl,'Conclusão':fmtFull(a.dataConclusao)}));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(crono),'Cronograma');
      const pend=this.filteredAtivs().filter(a=>effStatus(a)!=='concluido').map(a=>({Atividade:a.atividade,Responsável:a.responsavelExec,Prazo:fmtFull(a.prazo),Status:STATUS[effStatus(a)].lbl}));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pend),'Pendências');
      const ca=[];S.planoContas.forEach(p=>{const at=ativs().find(a=>a.contas.includes(p.codigo));ca.push({Conta:p.codigo,Descrição:p.nome,Materialidade:p.materialidade,Atividade:at?at.atividade:'(sem atividade)',Status:at?STATUS[effStatus(at)].lbl:'—'});});
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ca),'Conta x Atividade');
      const resp=S.responsaveis.map(r=>{const at=ativs().filter(a=>a.responsavelExec===r.nome);return {Nome:r.nome,Área:r.area,Atividades:at.length,Pendências:at.filter(a=>effStatus(a)!=='concluido').length,Atrasos:at.filter(a=>effStatus(a)==='atrasado').length};});
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(resp),'Por responsável');
      XLSX.writeFile(wb,`allu_fechamento_${S.competenciaAtiva}.xlsx`);
      this.toast('Excel exportado ✓');
    };
    if(window.XLSX){build();return;}
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=build;s.onerror=()=>this.toast('Falha ao carregar biblioteca de Excel (verifique a rede).');
    document.head.appendChild(s);
  },

  /* ---------- infra modal / toast ---------- */
  openModal(){document.getElementById('overlay').classList.add('open');},
  closeModal(){document.getElementById('overlay').classList.remove('open');},
  toast(msg){const t=document.getElementById('toast');t.innerHTML=`<span class="ti">●</span>${msg}`;t.classList.add('show');clearTimeout(this._tt);this._tt=setTimeout(()=>t.classList.remove('show'),2400);}
};

document.addEventListener('keydown',e=>{if(e.key==='Escape'){App.closeModal();document.getElementById('notifPanel').classList.remove('open');}});
async function boot(){
  if(!CLOUD){                                   // arquivo ainda não configurado → preview local
    S=loadLocal();App.mostrarApp();App.init();marcarSync('local');return;
  }
  if(!window.supabase||!sb){
    App.erroLogin('Não foi possível carregar o login. Sua rede pode estar bloqueando o CDN do Supabase — me avise para embutir no próprio arquivo.');return;
  }
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session)await App.entrarComSessao(session);else App.mostrarLogin();
    sb.auth.onAuthStateChange(async(_ev,sess)=>{ if(sess&&!S)await App.entrarComSessao(sess); });
  }catch(e){ App.erroLogin('Erro ao iniciar a sessão: '+(e.message||e)); }
}
boot();
</script>
